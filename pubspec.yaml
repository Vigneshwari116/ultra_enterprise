name: ultra_enterprise
description: Commercial Enterprise Platform - Ultra
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  uuid: ^4.5.1
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  file_picker: ^8.1.2
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/ultra_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/ultra_logo.png
  web:
    generate: true
    image_path: assets/images/ultra_logo.png
    background_color: "#FFFFFF"
    theme_color: "#10233F"

flutter:
  uses-material-design: true
  assets:
    - assets/images/ultra_logo.png
