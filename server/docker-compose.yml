# Test API against ultra_copy on the VPS host Postgres (port 55432).
# Does not touch production ultra_api / ports — bind only on loopback.
#
# Before first start:
#   1. Create shared network if needed: docker network create shared
#   2. Copy .env.example to .env and set DATABASE_URL credentials
#   3. Apply migrations once (never against ultra_enterprise):
#        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/migrations/001_accounting.sql
#        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/migrations/003_users_sessions.sql
#
# Start: docker compose up -d --build
# Logs:  docker compose logs -f ultra_api_test

services:
  ultra_api_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultra_api_test
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      # First superuser, only when app_users is empty. No password is hard-coded.
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:3004:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared

networks:
  shared:
    external: true
    name: ${DOCKER_NETWORK:-shared}
